name: Build

on:
  push:
    branches:
      - work
    tags:
      - 'v*'
  pull_request:
    branches:
      - work
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: microsoft/setup-msbuild@v2

      - name: Build
        run: |
          foreach ($platform in 'Win32', 'x64') {
            foreach ($sln in 'src/TvtPlay.sln',
                             'BonDriver_Pipe_src/BonDriver_Pipe.sln',
                             'TvtAudioStretchFilter_src/baseclasses/BaseClasses_VC14.sln',
                             'TvtAudioStretchFilter_src/soundtouch/source/SoundTouch/SoundTouch.sln',
                             'TvtAudioStretchFilter_src/TvtAudioStretchFilter.sln') {
              msbuild $sln -p:Configuration=Release -p:Platform=$platform -p:PlatformToolset=v143 -m -v:m
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Package
        shell: bash
        run: |
          bash package.sh
          ls -l package/*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TvtPlay
          path: package/*.zip
          retention-days: 30
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
